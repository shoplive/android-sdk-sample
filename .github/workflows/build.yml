# Satisfy required status check "build" on develop (distribution README only — no app to compile).
name: build
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Landing page sanity
        run: |
          test -f README.md
          # Fail if SDK / sample app sources reappear on the docs branch
          ! test -d app
          echo "OK — distribution landing page"
