name: Product CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Update local.properties
      run: echo -e "sdk.dir=/Users/shoplive/Library/Android/sdk" > ./local.properties
      
    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace
